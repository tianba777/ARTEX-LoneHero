name: lonehero-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lonehero-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: artex_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artex -d artex_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:ci-local-only@127.0.0.1:5432/artex_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -p 1 -timeout 180s ./...
      - run: python3 -m unittest discover -s scripts/benchmark -p 'test_*.py'
      - run: bash -n scripts/backup.sh scripts/sync-upstream.sh
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: web/out
